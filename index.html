<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Juntadas Sub</title>
<script src="https://www.gstatic.com/firebasejs/12.16.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.16.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.16.0/firebase-database-compat.js"></script>
<style>

:root{
  --bg:#0b0c0f;
  --panel:#15171c;
  --panel-border:#262932;
  --text:#e9eaed;
  --text-dim:#8b909b;
  --accent:#ef5b23;
  --accent-soft:rgba(239,91,35,.14);
  --gold:#f0b429;
  --blue:#3d95d6;
  --red:#c2394f;
  --green:#3fa66a;
  --radius:14px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);}
body{
  font-family:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;
  -webkit-font-smoothing:antialiased;
  padding:20px 16px 60px;
}
#root{max-width:960px;margin:0 auto;}

.loading-screen{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:80px 0;color:var(--text-dim);}
.loading-screen .flame{font-size:40px;animation:pulse 1.2s ease-in-out infinite;}
@keyframes pulse{0%,100%{transform:scale(1);opacity:.7;}50%{transform:scale(1.15);opacity:1;}}

.app-header{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;margin-bottom:18px;}
.logo{font-size:20px;font-weight:800;letter-spacing:.03em;text-transform:uppercase;display:flex;align-items:center;gap:8px;}
.auth-box{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--text-dim);}
.header-right{display:flex;align-items:center;gap:14px;}

/* --- reacciones --- */
.reaction-btn{
  background:var(--panel);border:1px solid var(--panel-border);border-radius:999px;
  padding:3px 9px;font-size:12px;cursor:pointer;color:var(--text-dim);
  transition:border-color .15s,background .15s,color .15s;
}
.reaction-btn:hover{border-color:var(--accent);color:var(--text);}
.reaction-btn-active{background:var(--accent-soft,rgba(239,91,35,.14));border-color:var(--accent);color:var(--text);font-weight:700;}

/* --- checklist colaborativo --- */
.checklist{list-style:none;padding:0;margin:0 0 10px;font-size:13.5px;}
.checklist li{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px dashed var(--panel-border);}
.checklist li:last-child{border-bottom:none;}
.checklist-label{display:flex;align-items:center;gap:8px;flex:1;cursor:pointer;}
.checklist-done span{text-decoration:line-through;color:var(--text-dim);}
.checklist li{flex-wrap:wrap;}
.checklist-cat-tag{
  font-size:10.5px;background:var(--panel-border);color:var(--text-dim);
  padding:2px 8px;border-radius:999px;text-decoration:none !important;margin-left:4px;
}
.checklist-meta{display:flex;align-items:center;gap:10px;width:100%;margin-top:4px;padding-left:26px;}
.checklist-assign{
  background:var(--bg);border:1px solid var(--panel-border);color:var(--text);
  border-radius:6px;padding:3px 6px;font-size:11.5px;
}

/* --- premios sub --- */
.premios-list{list-style:none;padding:0;margin:0;font-size:13.5px;}
.premios-list li{padding:12px 0;border-bottom:1px dashed var(--panel-border);}
.premios-list li:last-child{border-bottom:none;}

/* --- avatares --- */
.avatar-icon{
  display:inline-flex;align-items:center;justify-content:center;border-radius:50%;
  flex-shrink:0;vertical-align:middle;object-fit:cover;
}
.avatar-initials{color:#fff;font-weight:800;}
.avatar-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:10px;margin:10px 0;}
.avatar-pick{
  display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;
  border:2px solid transparent;border-radius:12px;padding:4px;background:none;
}
.avatar-pick img{width:52px;height:52px;border-radius:50%;object-fit:cover;}
.avatar-pick span{font-size:10.5px;color:var(--text-dim);}
.avatar-pick-active{border-color:var(--accent);background:var(--accent-soft);}
.avatar-pick:hover{border-color:var(--accent);}

.avatar-current-row{display:flex;align-items:center;gap:14px;margin-bottom:16px;}
.avatar-current-img{width:64px;height:64px;border-radius:50%;object-fit:cover;border:2px solid var(--accent);flex-shrink:0;}
.avatar-current-label{font-weight:700;font-size:15px;}
.avatar-admin-toggle{
  background:none;border:none;color:var(--text-dim);font-size:12.5px;cursor:pointer;
  padding:10px 0 0;margin-top:10px;border-top:1px solid var(--panel-border);width:100%;text-align:left;
}
.avatar-admin-toggle:hover{color:var(--text);}
.avatar-admin-panel{margin-top:10px;}
.avatar-admin-panel select{margin-bottom:10px;}

/* --- próximo cumpleaños destacado --- */
.bday-compact-list{margin-top:10px;}
.bday-compact{display:flex;align-items:center;gap:12px;padding:8px 0;border-bottom:1px dashed var(--panel-border);}
.bday-compact:last-child{border-bottom:none;}
.bday-compact-info{flex:1;min-width:0;}
.bday-compact-name{font-weight:700;font-size:13.5px;}
.bday-compact-date{font-size:11.5px;color:var(--text-dim);}
.bday-compact-pill{background:var(--gold);color:#241600;font-weight:800;font-size:12px;padding:4px 12px;border-radius:999px;white-space:nowrap;flex-shrink:0;}
.link-toggle{
  background:none;border:none;color:var(--text-dim);font-size:12px;cursor:pointer;
  padding:10px 0 0;margin-top:6px;text-align:left;
}
.link-toggle:hover{color:var(--accent);}
.premio-cat-label{font-weight:700;margin-bottom:4px;}
.premio-result{color:var(--text);}
.premio-destacado{
  background:linear-gradient(135deg,rgba(239,91,35,.1),transparent);
  border-radius:10px;padding:12px 14px !important;margin:4px 0;border-bottom:none !important;
  border:1px solid rgba(239,91,35,.3);
}

/* --- campanita de novedades --- */
.bell-wrap{position:relative;}
.bell-btn{background:transparent;border:none;font-size:18px;cursor:pointer;position:relative;padding:4px;line-height:1;}
.bell-badge{
  position:absolute;top:-4px;right:-4px;background:var(--red);color:#fff;
  font-size:10px;font-weight:800;border-radius:999px;min-width:16px;height:16px;
  display:flex;align-items:center;justify-content:center;padding:0 3px;
}
.bell-dropdown{
  position:absolute;top:calc(100% + 8px);right:0;width:280px;max-height:320px;overflow-y:auto;
  background:var(--panel);border:1px solid var(--panel-border);border-radius:10px;
  padding:12px;box-shadow:0 8px 24px rgba(0,0,0,.4);z-index:30;text-align:left;
}
.bell-list{list-style:none;padding:0;margin:0 0 10px;font-size:12.5px;}
.bell-list li{padding:7px 0;border-bottom:1px dashed var(--panel-border);line-height:1.5;}
.bell-list li:last-child{border-bottom:none;}
.login-form{gap:8px;}
.login-form select, .login-form input{
  background:var(--panel);border:1px solid var(--panel-border);color:var(--text);
  border-radius:8px;padding:7px 10px;font-size:13px;
}
.login-error{width:100%;text-align:right;color:var(--red);font-size:12px;margin-top:-6px;margin-bottom:10px;}
.admin-tag{background:var(--gold);color:#2a1c00;border-radius:999px;padding:2px 8px;font-size:10.5px;font-weight:800;letter-spacing:.03em;}
.banner-warn{background:rgba(194,57,79,.12);border:1px solid var(--red);color:#f2b3bf;padding:10px 14px;border-radius:10px;font-size:13px;margin-bottom:14px;}

.tabs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:20px;}
.tab{
  background:var(--panel);border:1px solid var(--panel-border);color:var(--text-dim);
  padding:9px 15px;border-radius:999px;font-weight:700;font-size:12.5px;letter-spacing:.03em;
  text-transform:uppercase;cursor:pointer;transition:.15s;
}
.tab:hover{border-color:var(--accent);color:var(--text);}
.tab.active{background:var(--accent);border-color:var(--accent);color:#fff;}

.card{
  background:var(--panel);border:1px solid var(--panel-border);border-radius:var(--radius);
  padding:18px 20px;margin-bottom:14px;
}
.card h3{margin:0 0 10px;font-size:15px;letter-spacing:.02em;text-transform:uppercase;font-weight:800;}
.record-card{font-size:14px;}
.blacklist-card{background:rgba(194,57,79,.08);border-color:rgba(194,57,79,.4);}
.container-card{}
.names-line{font-size:14px;margin:6px 0;}
.hint{color:var(--text-dim);font-size:12.5px;margin:4px 0 0;line-height:1.5;}
.hint.italic{font-style:italic;}
.dim{color:var(--text-dim);}
.accent{color:var(--accent);font-weight:700;}
.blue{color:var(--blue);}
.green{color:var(--green);font-weight:700;}
.red{color:var(--red);font-weight:700;}
.link{color:var(--blue);cursor:pointer;text-decoration:underline;font-size:12.5px;}
.del-link{text-decoration:none;font-size:15px;}

.table-wrap{overflow-x:auto;}
table{border-collapse:collapse;width:100%;font-size:13px;}
table.board th, table.board td{padding:9px 10px;text-align:left;border-bottom:1px solid var(--panel-border);white-space:nowrap;}
table.board thead th{color:var(--text-dim);font-weight:700;font-size:11px;text-transform:uppercase;letter-spacing:.04em;}
td.name{font-weight:700;}

table.planilla{border-collapse:collapse;}
table.planilla th, table.planilla td{padding:8px 6px;text-align:center;border-bottom:1px solid var(--panel-border);font-size:12px;}
table.planilla thead th{color:var(--text-dim);font-weight:700;text-transform:uppercase;font-size:10.5px;letter-spacing:.03em;white-space:nowrap;}
.sticky-col{position:sticky;left:0;background:var(--panel);text-align:left !important;white-space:nowrap;padding-right:14px !important;font-weight:600;}

.badge{
  display:inline-flex;align-items:center;justify-content:center;
  width:26px;height:26px;border-radius:50%;font-size:13px;color:#fff;
}
.st-presente{background:var(--accent);}
.st-anfitrion{background:var(--gold);color:#2a1c00;}
.st-avisado{background:var(--blue);}
.st-sinavisar{background:var(--red);}
.cell-td{position:relative;}
.cell-td.clickable{cursor:pointer;}
.cell-td.clickable:hover .badge{outline:2px solid var(--text);}
.motivo-dot{position:absolute;top:6px;right:14px;width:6px;height:6px;border-radius:50%;background:#fff;}

.edit-td{background:var(--accent-soft);}
.edit-cell{display:flex;flex-direction:column;gap:6px;min-width:170px;padding:4px;}
.edit-cell select, .edit-cell input{
  background:var(--bg);border:1px solid var(--panel-border);color:var(--text);
  border-radius:6px;padding:6px 8px;font-size:12px;width:100%;
}
.edit-actions{display:flex;gap:6px;}

.legend{display:flex;flex-wrap:wrap;gap:14px;margin-top:14px;font-size:11.5px;color:var(--text-dim);}
.legend-item{display:flex;align-items:center;gap:6px;}
.legend .badge{width:20px;height:20px;font-size:10px;}
.legend .motivo-dot{position:static;}

.form-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;}
.form-row input, .form-row select{
  background:var(--bg);border:1px solid var(--panel-border);color:var(--text);
  border-radius:8px;padding:8px 10px;font-size:13px;flex:1;min-width:120px;
}
.btn{
  background:var(--accent);color:#fff;border:none;border-radius:8px;
  padding:9px 16px;font-weight:700;font-size:13px;cursor:pointer;letter-spacing:.02em;
}
.btn:hover{filter:brightness(1.1);}
.btn-sm{padding:7px 12px;font-size:12.5px;}
.btn-xs{padding:5px 10px;font-size:11.5px;}
.btn-ghost{background:transparent;border:1px solid var(--panel-border);color:var(--text-dim);}
.btn-opt{background:var(--panel);border:1px solid var(--panel-border);color:var(--text);}
.btn-opt:hover{border-color:var(--accent);}

.ext-log{list-style:none;padding:0;margin:10px 0 0;font-size:12.5px;}
.ext-log li{padding:3px 0;border-bottom:1px dashed var(--panel-border);}

.container-list{list-style:none;padding:0;margin:0;}
.container-list li{padding:8px 0;border-bottom:1px dashed var(--panel-border);font-size:13.5px;}
.container-list li:last-child{border-bottom:none;}

.topics-list{list-style:none;padding:0;margin:0;}
.topics-list li{padding:7px 0;border-bottom:1px dashed var(--panel-border);font-size:13.5px;}
.topics-list li:last-child{border-bottom:none;}

.settlements{list-style:none;padding:0;margin:0;}
.settlements li{padding:7px 0;border-bottom:1px dashed var(--panel-border);font-size:13.5px;}
.settlements li:last-child{border-bottom:none;}

.foro-head{display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:6px;margin-bottom:10px;font-size:14px;}
.comments{list-style:none;padding:0;margin:0 0 10px;font-size:13px;}
.comments li{padding:6px 0;border-bottom:1px dashed var(--panel-border);}

.trivia-q{font-size:15px;font-weight:600;display:flex;justify-content:space-between;align-items:center;gap:10px;}
.trivia-timer{background:var(--accent);color:#fff;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:800;}
.trivia-opts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px;}
@media(max-width:520px){.trivia-opts{grid-template-columns:1fr;}}

.participants-actions{display:flex;gap:14px;margin-top:8px;}
.participants-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px;margin-top:10px;}
.participant-chip{
  display:flex;align-items:center;gap:6px;background:var(--bg);border:1px solid var(--panel-border);
  border-radius:8px;padding:7px 10px;font-size:12.5px;cursor:pointer;user-select:none;
}
.participant-chip input{accent-color:var(--accent);width:14px;height:14px;}

.person-debts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px;}
@media(max-width:560px){.person-debts{grid-template-columns:1fr;}}
.person-debt-block{background:var(--bg);border:1px solid var(--panel-border);border-radius:10px;padding:12px 14px;}
.person-debt-name{font-weight:800;font-size:13.5px;text-transform:uppercase;letter-spacing:.02em;margin-bottom:6px;}
.debt-line{font-size:12.5px;padding:2px 0;color:var(--text-dim);}
.debt-line.red{color:var(--red);}
.debt-line.green{color:var(--green);}
.debt-line b{color:var(--text);}

.reset-card{text-align:center;}

.rsvp-vote-row{display:flex;gap:8px;margin:10px 0;flex-wrap:wrap;}
.rsvp-active-si{background:var(--green);color:#fff;border:none;}
.rsvp-active-tal{background:var(--gold);color:#2a1c00;border:none;}
.rsvp-active-no{background:var(--red);color:#fff;border:none;}
.rsvp-lists{display:flex;flex-direction:column;gap:4px;margin:10px 0;font-size:12.5px;}
.rsvp-group{color:var(--text-dim);}
.rsvp-admin-box{margin-top:12px;padding-top:12px;border-top:1px dashed var(--panel-border);}

@media(max-width:600px){
  .app-header{flex-direction:column;align-items:flex-start;}
  .logo{font-size:18px;}
}

/* --- fin de semana --- */
.notas-box{width:100%;background:var(--bg);border:1px solid var(--panel-border);color:var(--text);border-radius:8px;padding:8px;font-size:12.5px;min-height:56px;margin-bottom:6px;font-family:inherit;}
.finde-notas{font-size:12.5px;color:var(--text-dim);font-style:italic;margin:6px 0;line-height:1.5;}
.finde-chips{margin-top:10px;font-size:12.5px;}
.chip{display:inline-block;padding:3px 9px;border-radius:999px;margin:2px 3px 2px 0;font-size:11.5px;}
.chip-green{background:rgba(63,166,106,.15);color:var(--green);}
.chip-red{background:rgba(194,57,79,.15);color:var(--red);}
.chip-clickable{cursor:pointer;}
.chip-clickable:hover{outline:1px solid currentColor;}

/* --- container: etiquetas de origen --- */
.tag-auto{background:var(--red);color:#fff;font-size:10px;border-radius:999px;padding:2px 7px;margin-left:8px;}
.tag-voted{background:var(--gold);color:#2a1c00;font-size:10px;border-radius:999px;padding:2px 7px;margin-left:8px;}

/* --- estadísticas: gráfico --- */
.evo-chart{width:100%;height:200px;display:block;}

/* --- container: debates --- */
.debate-block{background:var(--bg);border:1px solid var(--panel-border);border-radius:10px;padding:12px 14px;margin-bottom:10px;}
.debate-block:last-child{margin-bottom:0;}
.debate-head{font-size:13px;margin-bottom:4px;}
.debate-reason{font-size:12.5px;font-style:italic;color:var(--text-dim);margin:4px 0 8px;line-height:1.5;}
.btn-debate-si{background:var(--red);color:#fff;border:none;}
.btn-debate-no{background:var(--green);color:#fff;border:none;}

/* --- estadísticas: podio --- */
.podium{display:flex;gap:12px;align-items:flex-end;justify-content:center;margin-top:16px;}
.podium-slot{flex:1;max-width:150px;text-align:center;}
.podium-medal{font-size:26px;margin-bottom:6px;filter:drop-shadow(0 2px 3px rgba(0,0,0,.4));}
.podium-names{font-size:12.5px;font-weight:800;margin-bottom:8px;min-height:34px;letter-spacing:.01em;}
.podium-bar{
  border-radius:12px 12px 5px 5px;
  display:flex;align-items:flex-end;justify-content:center;
  padding-bottom:12px;
  box-shadow:0 8px 18px rgba(0,0,0,.4), inset 0 1px 0 rgba(255,255,255,.25);
}
.podium-pct{font-size:18px;font-weight:900;letter-spacing:.01em;}
.podium-bar.tier-1{background:linear-gradient(180deg,#ffe38f 0%,#e0a930 55%,#b9821f 100%);color:#3a2400;}
.podium-bar.tier-2{background:linear-gradient(180deg,#eef2f6 0%,#b9c3cd 55%,#8b95a1 100%);color:#20242b;}

function fmtDate(iso) {
  const [y, m, d] = iso.split("-").map(Number);
  return `${d} de ${MONTHS_ES[m - 1]} de ${y}`;
}

function fmtMoney(n) {
  const v = Math.round((n + Number.EPSILON) * 100) / 100;
  return "$" + v.toLocaleString("es-AR", { maximumFractionDigits: 2 });
}

function escapeHtml(str) {
  if (str == null) return "";
  return String(str)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}

function sortedJuntadas() {

function simpleHash(str) {
  let h = 0;
  for (let i = 0; i < str.length; i++) {
    h = (h * 31 + str.charCodeAt(i)) >>> 0;
  }
  return h;
}

/* ---------- cálculos ---------- */

function attendeesOf(j) {
  return CORE_MEMBERS.filter(m => j.attendance[m] === "presente" || j.attendance[m] === "anfitrion");
}

function expenseParticipants(j) {
  if (j.expense && Array.isArray(j.expense.participants) && j.expense.participants.length) {
    return j.expense.participants;
  }
  return attendeesOf(j);
}

function computeStats(member) {
  const js = DB.juntadas;
  const total = js.length;
  let asistencias = 0, anfitrion = 0, faltas = 0, avisadas = 0;
  js.forEach(j => {
    const st = j.attendance[member];
    if (st === "presente" || st === "anfitrion") asistencias++;
    if (st === "anfitrion") anfitrion++;
    if (st === "avisado" || st === "sin_avisar") {
      faltas++;
      if (st === "avisado") avisadas++;
    }
  });
  const pct = total ? Math.round((asistencias / total) * 100) : 0;
  const confiab = faltas === 0 ? null : Math.round((avisadas / faltas) * 100);
  // racha: consecutivas desde la más reciente
  const desc = sortedJuntadas();
  let racha = 0;
  for (const j of desc) {
    const st = j.attendance[member];
    if (st === "presente" || st === "anfitrion") racha++;
    else break;
  }
  return { asistencias, total, pct, anfitrion, confiab, racha, faltas };
}

function bestStreak(member) {
  const asc = [...DB.juntadas].sort((a, b) => (a.date < b.date ? -1 : 1));
  let best = 0, cur = 0;
  asc.forEach(j => {
    const st = j.attendance[member];
    if (st === "presente" || st === "anfitrion") { cur++; best = Math.max(best, cur); }
    else cur = 0;
  });
  return best;
}

function computeRecord() {
  let best = { count: 0, date: null };
  DB.juntadas.forEach(j => {
    const count = attendeesOf(j).length;
    if (count > best.count) best = { count, date: j.date };
  });
  return best;
}

function computeBlacklist() {
  const desc = sortedJuntadas();
  if (!desc.length) return [];
  const last = desc[0];
  return CORE_MEMBERS.filter(m => {
    const st = last.attendance[m];
    return st === "avisado" || st === "sin_avisar";
  });
}

function computeContainerStreak(member) {
  const desc = sortedJuntadas();
  let streak = 0;
  for (const j of desc) {
    const st = j.attendance[member];
    if (st === "avisado" || st === "sin_avisar") streak++;
    else break;
  }
  return streak;
}

function containerMembersCombined() {
  const auto = CORE_MEMBERS.filter(m => computeContainerStreak(m) >= 2);
  const voted = DB.containerActiveByDebate || [];
  const set = new Set([...auto, ...voted]);
  return [...set].map(m => ({ m, auto: auto.includes(m), voted: voted.includes(m) }));
}

/* ---------- cálculos: fin de semana ---------- */

function sortedFindes() {
  return [...DB.findes].sort((a, b) => (a.date < b.date ? 1 : -1));
}

function computeFindeStats(member) {
  const total = DB.findes.length;
  const asistencias = DB.findes.filter(f => f.attendance[member]).length;
  const pct = total ? Math.round((asistencias / total) * 100) : 0;
  return { asistencias, total, pct };
}

function computeBalances() {
  const balance = {};
  CORE_MEMBERS.forEach(m => (balance[m] = 0));
  DB.juntadas.forEach(j => {
    if (!j.expense) return;
    const participants = expenseParticipants(j);
    if (!participants.length) return;
    const share = j.expense.monto / participants.length;
    participants.forEach(m => (balance[m] -= share));
    if (balance[j.expense.payer] === undefined) balance[j.expense.payer] = 0;
    balance[j.expense.payer] += j.expense.monto;
  });
  // aplicamos los pagos reales ya registrados: al que pagó se le achica la deuda,
  // al que cobró se le achica lo que le deben — así "para saldar cuentas" y el
  // detalle por persona reflejan la realidad, no solo lo calculado en teoría.
  (DB.payments || []).forEach(p => {
    if (balance[p.from] === undefined) balance[p.from] = 0;
    if (balance[p.to] === undefined) balance[p.to] = 0;
    balance[p.from] += p.monto;
    balance[p.to] -= p.monto;
  });
  return balance;
}

function computeSettlements(balance) {
  const creditors = [];
  const debtors = [];
  Object.entries(balance).forEach(([m, v]) => {
    if (v > 0.5) creditors.push({ m, v });
    else if (v < -0.5) debtors.push({ m, v: -v });
  });
  creditors.sort((a, b) => b.v - a.v);
  debtors.sort((a, b) => b.v - a.v);
  const moves = [];
  let i = 0, j = 0;
  while (i < debtors.length && j < creditors.length) {
    const amt = Math.min(debtors[i].v, creditors[j].v);
    moves.push({ from: debtors[i].m, to: creditors[j].m, amt });
    debtors[i].v -= amt;
    creditors[j].v -= amt;
    if (debtors[i].v < 0.5) i++;
    if (creditors[j].v < 0.5) j++;
  }
  return moves;
}

function tallyCategory(cat) {
  const counts = {};
  Object.values(cat.votes || {}).forEach(c => { if (c) counts[c] = (counts[c] || 0) + 1; });
  const ranked = Object.entries(counts).sort((a, b) => b[1] - a[1]);
  if (!ranked.length) return { winner: "", second: "" };
  const topVotes = ranked[0][1];
  const winners = ranked.filter(([, v]) => v === topVotes).map(([n]) => n);
  const rest = ranked.filter(([, v]) => v !== topVotes);
  let second = "";
  if (rest.length) {
    const secondVotes = rest[0][1];
    second = rest.filter(([, v]) => v === secondVotes).map(([n]) => n).join(" / ");
  }
  return { winner: winners.join(" / "), second };
}

async function closeVoting(seasonId) {
  if (!isAdmin(currentUser)) return;
  const season = findSeason(seasonId);
  if (!season || season.status !== "votacion_abierta") return;
  season.categories.forEach(cat => {
    const { winner, second } = tallyCategory(cat);
    cat.winner = winner;
    cat.second = second;
  });
  season.status = "cerrada";
  await saveDB();
  render();
}

function submitCloseVoting(seasonId) {
  if (!confirm("¿Cerrar la votación y guardar los resultados para siempre? No se puede deshacer, aunque después se puede corregir a mano si hace falta.")) return;
  closeVoting(seasonId);
}

async function setManualResult(seasonId, catId, winner, second, note) {
  if (!isAdmin(currentUser)) return;
  const season = findSeason(seasonId);
  if (!season) return;
  const cat = season.categories.find(c => c.id === catId);
  if (!cat) return;
  cat.winner = (winner || "").trim();
  cat.second = (second || "").trim();
  cat.note = (note || "").trim();
  await saveDB();
  render();
}

function submitManualResult(seasonId) {
  const catId = document.getElementById("edit-premio-cat-" + seasonId).value;
  const winner = document.getElementById("edit-premio-winner-" + seasonId).value;
  const second = document.getElementById("edit-premio-second-" + seasonId).value;
  const note = document.getElementById("edit-premio-note-" + seasonId).value;
  setManualResult(seasonId, catId, winner, second, note);
}

function avatarColorFor(name) {
  let hash = 0;
  for (let i = 0; i < name.length; i++) hash = (hash * 31 + name.charCodeAt(i)) >>> 0;
  const colors = ["#4F8CFF","#7C3AED","#14B8A6","#F59E0B","#EF4444","#22C55E","#EC4899","#F97316"];
  return colors[hash % colors.length];
}

function initialsFor(name) {
  const parts = name.trim().split(/\s+/).filter(Boolean);
  if (parts.length >= 2) return (parts[0][0] + parts[1][0]).toUpperCase();
  return name.slice(0, 2).toUpperCase();
}

function renderAvatarIcon(name, size) {
  const s = size || 30;
  const avatarId = DB.avatars[name];
  const found = AVATAR_GALLERY.find(a => a.id === avatarId);
  if (found) {
    return `<img src="${found.data}" class="avatar-icon" style="width:${s}px;height:${s}px;" alt="${escapeHtml(name)}"/>`;
  }
  const color = avatarColorFor(name);
  const fontSize = Math.round(s * 0.4);
  return `<span class="avatar-icon avatar-initials" style="width:${s}px;height:${s}px;font-size:${fontSize}px;background:${color};" aria-hidden="true">${escapeHtml(initialsFor(name))}</span>`;
}

async function setAvatar(member, avatarId) {
  if (currentUser !== member && !isAdmin(currentUser)) return;
  if (!AVATAR_GALLERY.some(a => a.id === avatarId)) return;
  DB.avatars[member] = avatarId;
  await saveDB();
  render();
}

/* ---------- cumpleaños ---------- */

function daysUntilBirthday(mmdd) {
  const [mm, dd] = mmdd.split("-").map(Number);
  const now = new Date();
  const todayMid = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  let next = new Date(now.getFullYear(), mm - 1, dd);
  if (next < todayMid) next = new Date(now.getFullYear() + 1, mm - 1, dd);
  return Math.round((next - todayMid) / 86400000);
}

function formatMMDD(mmdd) {
  const [mm, dd] = mmdd.split("-").map(Number);
  return `${dd} de ${MESES[mm - 1]}`;
}

function daysUntilDate(dateStr) {
  const target = new Date(dateStr + "T00:00:00");
  const now = new Date();
  const todayMid = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  return Math.round((target - todayMid) / 86400000);
}

async function setBirthday(member, dateStr) {
  if (currentUser !== member && !isAdmin(currentUser)) return;
  if (!dateStr) { delete DB.birthdays[member]; await saveDB(); render(); return; }
  DB.birthdays[member] = dateStr.slice(5); // guardamos solo "MM-DD", el año no importa para un cumpleaños
  await saveDB();
  render();
}

function submitMyBirthday() {
  const input = document.getElementById("my-birthday-input");
  setBirthday(currentUser, input.value);
}

function submitAdminBirthday() {
  const member = document.getElementById("admin-birthday-member").value;
  const input = document.getElementById("admin-birthday-input");
  setBirthday(member, input.value);
}

function suggestHost() {
  const last = lastHostDates();
  const sorted = [...CORE_MEMBERS].sort((a, b) => {
    const da = last[a], db = last[b];
    if (da === null && db === null) return 0;
    if (da === null) return -1;
    if (db === null) return 1;
    return da < db ? -1 : da > db ? 1 : 0;
  });
  return sorted[0];
}

/* ---------- persistencia ---------- */

async function loadAll() {
  loading = true;
  loadError = false;
  render();

  if (!initFirebase()) {
    console.error("Firebase no está configurado o no cargó el SDK.");
    loadError = true;
    DB = seedDB();
    AUTH = {};
    loading = false;
    render();
    return;
  }

  const signedIn = await firebaseSignIn();
  if (!signedIn) {
    console.error("No se pudo autenticar contra Firebase (revisá que Anonymous esté habilitado).");
    loadError = true;
    DB = seedDB();
    AUTH = {};
    loading = false;
    render();
    return;
  }

  try {
    const dbSnap = await fbRoot.ref("db").once("value");
    if (dbSnap.exists()) {
      DB = dbSnap.val();
      normalizeDB();
    } else {
      DB = seedDB();
      await fbRoot.ref("db").set(DB);
    }

    const authSnap = await fbRoot.ref("auth").once("value");
    if (authSnap.exists()) {
      AUTH = authSnap.val();
    } else {
      AUTH = {};
      await fbRoot.ref("auth").set(AUTH);
    }

    // sincronización en vivo: si otro guarda algo, se actualiza solo acá
    fbRoot.ref("db").on("value", snap => {
      if (editingCell) return; // no pisar un formulario que estoy llenando
      if (snap.exists()) {
        DB = snap.val();
        normalizeDB();
        render();
      }
    });
  } catch (err) {
    console.error("Error cargando datos:", err);
    loadError = true;
    DB = seedDB();
    AUTH = {};
  }
  loading = false;
  render();
}

async function saveDB() {
  try {
    await fbRoot.ref("db").set(DB);
  } catch (err) {
    console.error("Error guardando db:", err);
    alert("No se pudo guardar el cambio. Revisá tu conexión e intentá de nuevo.");
  }
}

async function saveAuth() {
  try {
    await fbRoot.ref("auth").set(AUTH);
  } catch (err) {
    console.error("Error guardando auth:", err);
  }
}

async function confirmRsvp(host) {
  if (!isAdmin(currentUser) || !DB.rsvp) return;
  if (!host) { alert("Elegí quién anfitrionea."); return; }
  const date = DB.rsvp.date;
  if (DB.juntadas.some(j => j.date === date)) {
    alert("Ya existe una juntada en esa fecha, se descarta la votación.");
    DB.rsvp = null;
    await saveDB();
    render();
    return;
  }
  const attendance = {};
  const motivo = {};
  const responses = DB.rsvp.responses || {};
  CORE_MEMBERS.forEach(m => {
    if (m === host) { attendance[m] = "anfitrion"; return; }
    const r = responses[m];
    if (r === "no") { attendance[m] = "avisado"; motivo[m] = "Avisó que no venía"; }
    else if (r === "tal_vez") { attendance[m] = "avisado"; motivo[m] = "Había dicho que tal vez venía"; }
    else { attendance[m] = "presente"; }
  });
  DB.juntadas.push({ date, host, attendance, motivo, expense: null });
  DB.rsvp = null;
  await saveDB();
  render();
}

/* ---------- acciones: trivia ---------- */

function triviaQuestionFor(date) {
  const idx = simpleHash(date) % TRIVIA_POOL.length;
  return TRIVIA_POOL[idx];
}

function startTrivia(date) {
  triviaStarted[date] = true;
  triviaTimeLeft = 10;
  render();
  clearInterval(triviaTimerInterval);
  triviaTimerInterval = setInterval(() => {
    triviaTimeLeft--;
    const el = document.getElementById("trivia-timer");
    if (el) el.textContent = triviaTimeLeft + "s";
    if (triviaTimeLeft <= 0) {
      clearInterval(triviaTimerInterval);
      lockTriviaTimeout(date);
    }
  }, 1000);
}

async function lockTriviaTimeout(date) {
  if (!DB.trivia.responses[date]) DB.trivia.responses[date] = {};
  if (!DB.trivia.responses[date][currentUser]) {
    DB.trivia.responses[date][currentUser] = { choice: null, correct: false };
    await saveDB();
  }
  render();
}

async function answerTrivia(date, choiceIdx) {
  clearInterval(triviaTimerInterval);
  const question = triviaQuestionFor(date);
  const correct = choiceIdx === question.correct;
  if (!DB.trivia.responses[date]) DB.trivia.responses[date] = {};
  DB.trivia.responses[date][currentUser] = { choice: choiceIdx, correct };
  await saveDB();
  render();
}

function triviaRanking() {
  const scores = {};
  CORE_MEMBERS.forEach(m => (scores[m] = 0));
  Object.values(DB.trivia.responses).forEach(dayResponses => {
    Object.entries(dayResponses).forEach(([member, r]) => {
      if (scores[member] === undefined) scores[member] = 0;
      if (r.correct) scores[member]++;
    });
  });
  return Object.entries(scores).sort((a, b) => b[1] - a[1]);
}

/* ---------- acciones: debates del container ---------- */

async function openDebate(member, reason) {
  if (!currentUser) return;
  if (!member) { alert("Elegí a quién nominás."); return; }
  if (!reason || !reason.trim()) { alert("Escribí el motivo."); return; }
  const debate = {
    id: "d" + Date.now() + Math.floor(Math.random() * 1000),
    member,
    reason: reason.trim(),
    openedBy: currentUser,
    openedDate: new Date().toISOString().slice(0, 10),
    votes: {},
    status: "abierto",
    result: null,
    closedDate: null,
  };
  DB.containerDebates.push(debate);
  await saveDB();
  render();
}

async function voteDebate(id, choice) {
  if (!currentUser) return;
  if (!["si", "no"].includes(choice)) return;
  const d = DB.containerDebates.find(x => x.id === id);
  if (!d || d.status !== "abierto") return;
  d.votes[currentUser] = choice;
  await saveDB();
  render();
}

async function closeDebate(id) {
  if (!isAdmin(currentUser)) return;
  const d = DB.containerDebates.find(x => x.id === id);
  if (!d || d.status !== "abierto") return;
  const votes = Object.values(d.votes);
  const si = votes.filter(v => v === "si").length;
  const no = votes.filter(v => v === "no").length;
  const result = si > no ? "container" : "absuelto";
  const msg = `Cerrar el debate sobre ${d.member} (Sí: ${si}, No: ${no}) → resultado: ${result === "container" ? "va al container" : "se salva"}. ¿Confirmar?`;
  if (!confirm(msg)) return;
  d.status = "cerrado";
  d.result = result;
  d.closedDate = new Date().toISOString().slice(0, 10);
  if (result === "container") {
    if (!DB.containerActiveByDebate.includes(d.member)) DB.containerActiveByDebate.push(d.member);
  } else {
    DB.containerActiveByDebate = DB.containerActiveByDebate.filter(m => m !== d.member);
  }
  await saveDB();
  render();
}

/* ---------------- GASTOS ---------------- */

function computeGastosDetail() {
  const aporto = {}, share = {};
  CORE_MEMBERS.forEach(m => { aporto[m] = 0; share[m] = 0; });
  DB.juntadas.forEach(j => {
    if (!j.expense) return;
    const participants = expenseParticipants(j);
    if (!participants.length) return;
    const s = j.expense.monto / participants.length;
    participants.forEach(m => { if (share[m] === undefined) share[m] = 0; share[m] += s; });
    if (aporto[j.expense.payer] === undefined) aporto[j.expense.payer] = 0;
    aporto[j.expense.payer] += j.expense.monto;
  });
  return { aporto, share };
}

          `).join("")}
        </div>
        <button class="btn btn-sm" style="margin-top:12px;" onclick="submitExpense()">Guardar gasto</button>
      </div>

  }

    <div class="card">
      <h3>🧾 Gastos por juntada</h3>
      <div class="table-wrap">
        <table class="board">
          <thead><tr><th>Fecha</th><th>Pagó</th><th>Monto</th><th>Entre</th><th>C/u</th><th>Confirmado</th><th></th></tr></thead>
          <tbody>
            ${desc.filter(j => j.expense).map(j => {
              const participants = expenseParticipants(j);
              const cu = participants.length ? j.expense.monto / participants.length : 0;
              return `<tr>
                <td>${fmtDate(j.date)}</td>
                <td class="name">${escapeHtml(j.expense.payer)}</td>
                <td>${fmtMoney(j.expense.monto)}</td>
                <td title="${participants.map(escapeHtml).join(", ")}">${participants.length}</td>
                <td>${fmtMoney(cu)}</td>

                <td>${currentUser ? `<a class="link" onclick="clearExpense('${j.date}')">borrar</a>` : ""}</td>
              </tr>`;
            }).join("") || `<tr><td colspan="7" class="hint">Todavía no se cargó ningún gasto.</td></tr>`}
          </tbody>
        </table>
      </div>
      <p class="hint">Tocá ✅ para confirmar que ya pagaste tu parte de un gasto — es solo informativo, no cambia los cálculos de saldo.</p>
    </div>
  `;

  const balanceTable = `
    <div class="card">
      <h3>⚖️ Balance por persona</h3>
      <div class="table-wrap">
        <table class="board">
          <thead><tr><th>Nombre</th><th>Aportó</th><th>Le tocaba</th><th>Balance</th></tr></thead>
          <tbody>
            ${CORE_MEMBERS.map(m => {
              const b = balance[m] || 0;
              const cls = b > 0.5 ? "green" : b < -0.5 ? "red" : "dim";
              return `<tr>
                <td class="name">${escapeHtml(m)}</td>
                <td>${fmtMoney(aporto[m] || 0)}</td>
                <td>${fmtMoney(share[m] || 0)}</td>
                <td class="${cls}">${b >= 0 ? "+" : ""}${fmtMoney(b)}</td>
              </tr>`;
            }).join("")}
          </tbody>
        </table>
      </div>
    </div>
  `;

  const settlementsCard = `
    <div class="card">
      <h3>🤝 Para saldar cuentas</h3>
      ${settlements.length
        ? `<ul class="settlements">${settlements.map(s => `
            <li>
              <b>${escapeHtml(s.from)}</b> le debe <b class="accent">${fmtMoney(s.amt)}</b> a <b>${escapeHtml(s.to)}</b>
              ${currentUser ? ` <a class="link" onclick="submitQuickPayment('${escapeAttr(s.from)}','${escapeAttr(s.to)}',${Math.round(s.amt)})">✅ ya se pagó</a>` : ""}
            </li>
          `).join("")}</ul>`
        : `<p class="hint">Todo saldado. 🎉</p>`}
      ${currentUser ? `
        <div class="form-row" style="margin-top:14px;border-top:1px solid var(--panel-border);padding-top:14px;">

          <span class="hint">le pagó a</span>
          <select id="payment-to">${CORE_MEMBERS.map(m => `<option value="${escapeHtml(m)}" ${m === CORE_MEMBERS[1] ? "selected" : ""}>${escapeHtml(m)}</option>`).join("")}</select>
          <input id="payment-monto" type="number" placeholder="Monto"/>
          <button class="btn btn-sm" onclick="submitManualPayment()">Registrar</button>
        </div>
        <p class="hint">Registrar un pago actualiza el saldo de los dos automáticamente — no hace falta borrar ni recalcular nada a mano.</p>
      ` : ""}
      ${DB.payments.length ? `
        <div style="margin-top:14px;border-top:1px solid var(--panel-border);padding-top:10px;">
          <p class="hint" style="margin-bottom:6px;"><b>Pagos ya registrados:</b></p>
          <ul class="settlements">
            ${[...DB.payments].reverse().map(p => `
              <li>
                <b>${escapeHtml(p.from)}</b> → <b>${escapeHtml(p.to)}</b>: ${fmtMoney(p.monto)}
                <span class="hint">(${fmtDate(p.date)}, anotado por ${escapeHtml(p.registeredBy)})</span>
                ${(currentUser === p.from || currentUser === p.to || isAdmin(currentUser)) ? ` <a class="link" onclick="removePayment('${p.id}')">deshacer</a>` : ""}
              </li>
            `).join("")}
          </ul>
        </div>
      ` : ""}
    </div>
  `;

  return form + table + balanceTable + settlementsCard + renderSettlementsByPersonCard(settlements);
}

function onExpDateChange(date) {
  expFormDate = date;
  render();
}

function setAllParticipants(checked) {
  document.querySelectorAll(".exp-participant").forEach(el => (el.checked = checked));
}

function setDefaultParticipants() {
  const desc = sortedJuntadas();
  const j = desc.find(x => x.date === expFormDate);
  if (!j) return;
  const defaults = attendeesOf(j);
  document.querySelectorAll(".exp-participant").forEach(el => {
    el.checked = defaults.includes(el.value);
  });
}

function groupSettlementsByPerson(settlements) {
  const map = {};
  CORE_MEMBERS.forEach(m => { map[m] = { owes: [], owedBy: [] }; });
  settlements.forEach(s => {
    if (!map[s.from]) map[s.from] = { owes: [], owedBy: [] };
    if (!map[s.to]) map[s.to] = { owes: [], owedBy: [] };
    map[s.from].owes.push({ to: s.to, amt: s.amt });
    map[s.to].owedBy.push({ from: s.from, amt: s.amt });
  });
  return map;
}

function renderSettlementsByPersonCard(settlements) {
  const map = groupSettlementsByPerson(settlements);
  const withActivity = CORE_MEMBERS.filter(m => map[m].owes.length || map[m].owedBy.length);
  if (!withActivity.length) {
    return `<div class="card"><h3>📋 Detalle por persona</h3><p class="hint">Todo saldado, nadie le debe nada a nadie. 🎉</p></div>`;
  }
  return `
    <div class="card">
      <h3>📋 Detalle por persona</h3>
      <p class="hint">Tocá a cada uno y ves puntualmente qué le debe a quién.</p>
      <div class="person-debts">
        ${withActivity.map(m => `
          <div class="person-debt-block">
            <div class="person-debt-name">${escapeHtml(m)}</div>
            ${map[m].owes.map(o => `<div class="debt-line red">↳ le debe <b>${fmtMoney(o.amt)}</b> a <b>${escapeHtml(o.to)}</b></div>`).join("")}
            ${map[m].owedBy.map(o => `<div class="debt-line green">↳ <b>${escapeHtml(o.from)}</b> le debe <b>${fmtMoney(o.amt)}</b></div>`).join("")}
          </div>
        `).join("")}
      </div>
    </div>
  `;
}

/* ---------------- CONTAINER ---------------- */

function renderContainer() {
  const combined = containerMembersCombined();
  const streaks = CORE_MEMBERS.map(m => ({ m, streak: computeContainerStreak(m) }));
  const oneAway = streaks.filter(s => s.streak === 1 && !combined.some(c => c.m === s.m));

  const explanation = `
    <div class="card">
      <h3>📦 Cómo funciona el Container</h3>
      <p class="hint">Dos caminos: automático (2 juntadas seguidas ausente) o por debate — cualquiera puede abrir una moción explicando el motivo, el grupo vota Sí/No, y el admin cierra el debate aplicando el resultado. También sirve para "indultar" a alguien: si el debate sale "No", y estaba en el container por un debate anterior, sale.</p>
    </div>
  `;

  const inContainerCard = `
    <div class="card container-card">
      <h3>😬 En el container</h3>
      ${combined.length
        ? `<ul class="container-list">${combined.map(c => `
            <li><b>${escapeHtml(c.m)}</b>
              ${c.auto ? '<span class="tag-auto">🤖 2 seguidas</span>' : ""}
              ${c.voted ? '<span class="tag-voted">🗳️ debate</span>' : ""}
            </li>`).join("")}</ul>`
        : `<p class="hint">Nadie está en el container. Así se hace. 💪</p>`}
    </div>
  `;

  const oneAwayCard = oneAway.length ? `
    <div class="card">
      <h3>🔸 A un paso del container</h3>
      <ul class="container-list">${oneAway.map(s => `<li><b>${escapeHtml(s.m)}</b> <span class="dim">— si falta la próxima, cae</span></li>`).join("")}</ul>
    </div>
  ` : "";

  const openDebateForm = currentUser ? `
    <div class="card">
      <h3>⚖️ Abrir un debate</h3>
      <div class="form-row">
        <select id="debate-member">${CORE_MEMBERS.map(m => `<option value="${escapeHtml(m)}">${escapeHtml(m)}</option>`).join("")}</select>
        <input id="debate-reason" placeholder="¿Por qué debería ir (o salir) del container?" />
        <button class="btn btn-sm" onclick="submitOpenDebate()">Abrir debate</button>
      </div>
    </div>
  ` : `<div class="card"><p class="hint">Iniciá sesión para abrir un debate o votar.</p></div>`;

  const openDebates = DB.containerDebates.filter(d => d.status === "abierto");
  const closedDebates = DB.containerDebates
    .filter(d => d.status === "cerrado")
    .sort((a, b) => (a.closedDate < b.closedDate ? 1 : -1))
    .slice(0, 5);

  const openDebatesCard = `
    <div class="card">
      <h3>🗣️ Debates abiertos</h3>
      ${openDebates.length ? openDebates.map(renderDebateBlock).join("") : `<p class="hint">No hay debates abiertos ahora mismo.</p>`}
    </div>
  `;

  const closedDebatesCard = closedDebates.length ? `
    <div class="card">
      <h3>📜 Últimos debates resueltos</h3>
      <ul class="container-list">
        ${closedDebates.map(d => {
          const si = Object.values(d.votes).filter(v => v === "si").length;
          const no = Object.values(d.votes).filter(v => v === "no").length;
          return `<li><b>${escapeHtml(d.member)}</b> — ${d.result === "container" ? "📦 fue al container" : "✅ se salvó"} <span class="dim">(${fmtDate(d.closedDate)}, Sí ${si} · No ${no})</span><br/><span class="dim">"${escapeHtml(d.reason)}"</span></li>`;
        }).join("")}
      </ul>
    </div>
  ` : "";

  return explanation + inContainerCard + oneAwayCard + openDebateForm + openDebatesCard + closedDebatesCard;
}

function renderDebateBlock(d) {
  const si = Object.values(d.votes).filter(v => v === "si").length;
  const no = Object.values(d.votes).filter(v => v === "no").length;
  const myVote = currentUser ? d.votes[currentUser] : null;
  return `
    <div class="debate-block">
      <div class="debate-head"><b>${escapeHtml(d.member)}</b> <span class="dim">— propuesto por ${escapeHtml(d.openedBy)} el ${fmtDate(d.openedDate)}</span></div>
      <p class="debate-reason">"${escapeHtml(d.reason)}"</p>
      <p class="dim">Sí: ${si} &nbsp; No: ${no}</p>
      ${currentUser ? `
        <div class="rsvp-vote-row">
          <button class="btn btn-sm ${myVote === "si" ? "btn-debate-si" : "btn-ghost"}" onclick="voteDebate('${d.id}','si')">Sí, que vaya</button>
          <button class="btn btn-sm ${myVote === "no" ? "btn-debate-no" : "btn-ghost"}" onclick="voteDebate('${d.id}','no')">No, que se salve</button>
        </div>
      ` : ""}
      ${isAdmin(currentUser) ? `<a class="link" onclick="closeDebate('${d.id}')">Cerrar debate</a>` : ""}
    </div>
  `;
}

function submitOpenDebate() {
  const member = document.getElementById("debate-member").value;
  const reason = document.getElementById("debate-reason").value;
  openDebate(member, reason);
}

/* ---------------- TRIVIA ---------------- */

function renderTrivia() {
  const desc = sortedJuntadas();
  if (!desc.length) return `<div class="card"><p class="hint">Todavía no hay juntadas.</p></div>`;
  const date = desc[0].date;
  const question = triviaQuestionFor(date);
  const myResponse = DB.trivia.responses[date] && DB.trivia.responses[date][currentUser];

  let body;
  if (!currentUser) {
    body = `<p class="hint">Iniciá sesión para jugar la trivia de esta semana.</p>`;
  } else if (myResponse) {
    const correctOpt = question.opts[question.correct];
    body = `
      <p class="${myResponse.correct ? "green" : "red"}">
        ${myResponse.correct ? "✓ ¡Acertaste!" : myResponse.choice === null ? "⏱️ Se acabó el tiempo." : "✕ No era esa."}
      </p>
      <p class="hint">La pregunta era: <b>${escapeHtml(question.q)}</b><br/>Respuesta correcta: <b>${escapeHtml(correctOpt)}</b></p>
    `;
  } else if (triviaStarted[date]) {
    body = `
      <p class="trivia-q">${escapeHtml(question.q)} <span id="trivia-timer" class="trivia-timer">${triviaTimeLeft}s</span></p>
      <div class="trivia-opts">
        ${question.opts.map((o, i) => `<button class="btn btn-opt" onclick="answerTrivia('${date}', ${i})">${escapeHtml(o)}</button>`).join("")}
      </div>
    `;
  } else {
    body = `
      <p class="hint">Una pregunta nueva por juntada, la misma para todos. Al arrancar tenés 10 segundos para elegir.</p>
      <button class="btn" onclick="startTrivia('${date}')">Comenzar</button>
    `;
  }

  const ranking = triviaRanking();

  return `
    <div class="card">
      <h3>🎲 Trivia de la semana</h3>
      <p class="dim">Juntada del ${fmtDate(date)}</p>
      ${body}
    </div>
    <div class="card">
      <h3>🏆 Ranking de trivia</h3>
      <div class="table-wrap">
        <table class="board">
          <thead><tr><th>#</th><th>Nombre</th><th>Aciertos</th></tr></thead>
          <tbody>${ranking.map(([m, s], i) => `<tr><td>${i + 1}</td><td class="name">${escapeHtml(m)}</td><td class="accent">${s}</td></tr>`).join("")}</tbody>
        </table>
      </div>
    </div>
  `;
}

          <div><b class="green">✓ Vinieron (${vinieron.length})</b><br/>${vinieron.map(m => renderFindeChip(f.date, m, true)).join(" ")}</div>
          <div style="margin-top:8px;"><b class="red">✕ No vinieron (${noVinieron.length})</b><br/>${noVinieron.map(m => renderFindeChip(f.date, m, false)).join(" ")}</div>
        </div>
      </div>
    `;
  }).join("");

  return ranking + addForm + (list || (DB.findes.length ? "" : ""));
}

function renderFindeChip(date, member, isIn) {
  const clickable = currentUser === member || isAdmin(currentUser);
  return `<span class="chip ${isIn ? "chip-green" : "chip-red"} ${clickable ? "chip-clickable" : ""}" ${clickable ? `onclick="toggleFindeAttendance('${date}','${escapeAttr(member)}')"` : ""}>${escapeHtml(member)}</span>`;
}

function submitAddFinde() {
  const date = document.getElementById("new-finde-date").value;
  addFinde(date);
}

function submitFindeNotas(date) {
  const text = document.getElementById("notas-" + date).value;
  saveFindeNotas(date, text);
}

/* ---------------- ESTADÍSTICAS ---------------- */

function renderPodiumGeneric(title, statsFn) {
  const rows = CORE_MEMBERS.map(m => ({ m, pct: statsFn(m).pct })).sort((a, b) => b.pct - a.pct);
  const tiers = [];
  rows.forEach(r => {
    let tier = tiers.find(t => t.pct === r.pct);
    if (!tier) { tier = { pct: r.pct, members: [] }; tiers.push(tier); }
    tier.members.push(r.m);
  });
  const top3 = tiers.slice(0, 3); // top3[0] = 1er puesto, [1] = 2do, [2] = 3ro
  if (!top3.length) return "";
  const displayOrder = [1, 0, 2]; // se muestran visualmente como 2do, 1ro, 3ro
  const medals = { 0: "🥇", 1: "🥈", 2: "🥉" };
  const heights = { 0: "150px", 1: "105px", 2: "80px" };
  const slots = displayOrder.map(idx => {
    const tier = top3[idx];
    if (!tier) return `<div class="podium-slot"></div>`;
    return `
      <div class="podium-slot">
        <div class="podium-medal">${medals[idx]}</div>
        <div class="podium-names">${tier.members.map(escapeHtml).join("<br/>")}</div>
        <div class="podium-bar tier-${idx + 1}" style="min-height:${heights[idx]}">
          <span class="podium-pct">${tier.pct}%</span>
        </div>
      </div>
    `;
  }).join("");
  return `
    <div class="card">
      <h3>${title}</h3>
      <div class="podium">${slots}</div>
    </div>
  `;
}

function renderEstadisticas() {
  const rows = CORE_MEMBERS.map(m => ({ m, cur: computeStats(m).racha, best: bestStreak(m) }))
    .sort((a, b) => b.cur - a.cur || b.best - a.best);

  const podioJueves = renderPodiumGeneric("🏆 Podio de asistencia — Jueves", m => computeStats(m));
  const podioFindes = DB.findes.length ? renderPodiumGeneric("🏆 Podio de asistencia — Findes", m => computeFindeStats(m)) : "";

  const streakTable = `
    <div class="card">
      <h3>🔥 Racha actual vs. mejor racha histórica</h3>
      <div class="table-wrap">
        <table class="board">
          <thead><tr><th>Nombre</th><th>Racha actual</th><th>Mejor racha histórica</th></tr></thead>
          <tbody>${rows.map(r => `<tr><td class="name">${escapeHtml(r.m)}</td><td class="accent">${r.cur} 🔥</td><td class="dim">${r.best} 🔥</td></tr>`).join("")}</tbody>
        </table>
      </div>
    </div>
  `;

  const evoCard = `
    <div class="card">
      <h3>📈 Evolución de asistencia por juntada</h3>
      ${renderEvolutionChart()}
    </div>
  `;

  const compareCard = DB.findes.length ? renderJuevesVsFinde() : "";

  return podioJueves + podioFindes + streakTable + evoCard + compareCard;
}

function renderEvolutionChart() {
  const asc = [...DB.juntadas].sort((a, b) => (a.date < b.date ? -1 : 1));
  if (asc.length < 2) return `<p class="hint">Hace falta más historial para graficar la evolución.</p>`;
  const W = 640, H = 200, padL = 34, padR = 10, padT = 10, padB = 10;
  const n = asc.length;
  const pts = asc.map((j, i) => {
    const pct = Math.round((attendeesOf(j).length / CORE_MEMBERS.length) * 100);
    const x = padL + (i * (W - padL - padR)) / (n - 1);
    const y = padT + ((100 - pct) / 100) * (H - padT - padB);
    return { x, y, pct, date: j.date };
  });
  const pathD = pts.map((p, i) => (i === 0 ? "M" : "L") + p.x.toFixed(1) + "," + p.y.toFixed(1)).join(" ");
  const dots = pts.map(p => `<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="3.5" fill="var(--accent)"><title>${fmtDate(p.date)}: ${p.pct}%</title></circle>`).join("");
  const grid = [0, 50, 100].map(v => {
    const y = padT + ((100 - v) / 100) * (H - padT - padB);
    return `<line x1="${padL}" y1="${y}" x2="${W - padR}" y2="${y}" stroke="#262932" stroke-width="1"/><text x="2" y="${y + 4}" font-size="10" fill="#8b909b">${v}%</text>`;
  }).join("");
  return `
    <svg viewBox="0 0 ${W} ${H}" class="evo-chart" preserveAspectRatio="none">
      ${grid}
      <path d="${pathD}" fill="none" stroke="#ef5b23" stroke-width="2"/>
      ${dots}
    </svg>
    <p class="hint">Pasá el mouse sobre los puntos para ver la fecha y el % de esa juntada. Primera: ${fmtDate(pts[0].date)} · Última: ${fmtDate(pts[pts.length - 1].date)}</p>
  `;
}

function renderJuevesVsFinde() {
  const rows = CORE_MEMBERS.map(m => ({ m, j: computeStats(m).pct, f: computeFindeStats(m).pct }));
  return `
    <div class="card">
      <h3>⚖️ Jueves vs. Finde</h3>
      <div class="table-wrap">
        <table class="board">
          <thead><tr><th>Nombre</th><th>Jueves</th><th>Finde</th></tr></thead>
          <tbody>${rows.map(r => `<tr><td class="name">${escapeHtml(r.m)}</td><td class="accent">${r.j}%</td><td class="blue">${r.f}%</td></tr>`).join("")}</tbody>
        </table>
      </div>
    </div>
  `;
}
