<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Fútbol Sub</title>
<script src="https://www.gstatic.com/firebasejs/12.16.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.16.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.16.0/firebase-database-compat.js"></script>
<style>

:root{
  --bg:#0b0c0f;
  --panel:#15171c;
  --panel-border:#262932;
  --text:#e9eaed;
  --text-dim:#8b909b;
  --accent:#ef5b23;
  --accent-soft:rgba(239,91,35,.14);
  --gold:#f0b429;
  --blue:#3d95d6;
  --red:#c2394f;
  --green:#3fa66a;
  --radius:14px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);}
body{
  font-family:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;
  -webkit-font-smoothing:antialiased;
  padding:20px 16px 60px;
}
#root{max-width:960px;margin:0 auto;}

.loading-screen{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:80px 0;color:var(--text-dim);}
.loading-screen .flame{font-size:40px;animation:pulse 1.2s ease-in-out infinite;}
@keyframes pulse{0%,100%{transform:scale(1);opacity:.7;}50%{transform:scale(1.15);opacity:1;}}

.app-header{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;margin-bottom:18px;}
.logo{font-size:20px;font-weight:800;letter-spacing:.03em;text-transform:uppercase;display:flex;align-items:center;gap:8px;}
.auth-box{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--text-dim);}
.header-right{display:flex;align-items:center;gap:14px;}

/* --- reacciones --- */
.reaction-btn{
  background:var(--panel);border:1px solid var(--panel-border);border-radius:999px;
  padding:3px 9px;font-size:12px;cursor:pointer;color:var(--text-dim);
  transition:border-color .15s,background .15s,color .15s;
}
.reaction-btn:hover{border-color:var(--accent);color:var(--text);}
.reaction-btn-active{background:var(--accent-soft,rgba(239,91,35,.14));border-color:var(--accent);color:var(--text);font-weight:700;}

/* --- checklist colaborativo --- */
.checklist{list-style:none;padding:0;margin:0 0 10px;font-size:13.5px;}
.checklist li{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px dashed var(--panel-border);}
.checklist li:last-child{border-bottom:none;}
.checklist-label{display:flex;align-items:center;gap:8px;flex:1;cursor:pointer;}
.checklist-done span{text-decoration:line-through;color:var(--text-dim);}
.checklist li{flex-wrap:wrap;}
.checklist-cat-tag{
  font-size:10.5px;background:var(--panel-border);color:var(--text-dim);
  padding:2px 8px;border-radius:999px;text-decoration:none !important;margin-left:4px;
}
.checklist-meta{display:flex;align-items:center;gap:10px;width:100%;margin-top:4px;padding-left:26px;}
.checklist-assign{
  background:var(--bg);border:1px solid var(--panel-border);color:var(--text);
  border-radius:6px;padding:3px 6px;font-size:11.5px;
}

/* --- premios sub --- */
.premios-list{list-style:none;padding:0;margin:0;font-size:13.5px;}
.premios-list li{padding:12px 0;border-bottom:1px dashed var(--panel-border);}
.premios-list li:last-child{border-bottom:none;}

/* --- avatares --- */
.avatar-icon{
  display:inline-flex;align-items:center;justify-content:center;border-radius:50%;
  flex-shrink:0;vertical-align:middle;object-fit:cover;
}
.avatar-initials{color:#fff;font-weight:800;}
.avatar-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:10px;margin:10px 0;}
.avatar-pick{
  display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;
  border:2px solid transparent;border-radius:12px;padding:4px;background:none;
}
.avatar-pick img{width:52px;height:52px;border-radius:50%;object-fit:cover;}
.avatar-pick span{font-size:10.5px;color:var(--text-dim);}
.avatar-pick-active{border-color:var(--accent);background:var(--accent-soft);}
.avatar-pick:hover{border-color:var(--accent);}

.avatar-current-row{display:flex;align-items:center;gap:14px;margin-bottom:16px;}
.avatar-current-img{width:64px;height:64px;border-radius:50%;object-fit:cover;border:2px solid var(--accent);flex-shrink:0;}
.avatar-current-label{font-weight:700;font-size:15px;}
.avatar-admin-toggle{
  background:none;border:none;color:var(--text-dim);font-size:12.5px;cursor:pointer;
  padding:10px 0 0;margin-top:10px;border-top:1px solid var(--panel-border);width:100%;text-align:left;
}
.avatar-admin-toggle:hover{color:var(--text);}
.avatar-admin-panel{margin-top:10px;}
.avatar-admin-panel select{margin-bottom:10px;}

/* --- próximo cumpleaños destacado --- */
.bday-compact-list{margin-top:10px;}
.bday-compact{display:flex;align-items:center;gap:12px;padding:8px 0;border-bottom:1px dashed var(--panel-border);}
.bday-compact:last-child{border-bottom:none;}
.bday-compact-info{flex:1;min-width:0;}
.bday-compact-name{font-weight:700;font-size:13.5px;}
.bday-compact-date{font-size:11.5px;color:var(--text-dim);}
.bday-compact-pill{background:var(--gold);color:#241600;font-weight:800;font-size:12px;padding:4px 12px;border-radius:999px;white-space:nowrap;flex-shrink:0;}
.link-toggle{
  background:none;border:none;color:var(--text-dim);font-size:12px;cursor:pointer;
  padding:10px 0 0;margin-top:6px;text-align:left;
}
.link-toggle:hover{color:var(--accent);}
.premio-cat-label{font-weight:700;margin-bottom:4px;}
.premio-result{color:var(--text);}
.premio-destacado{
  background:linear-gradient(135deg,rgba(239,91,35,.1),transparent);
  border-radius:10px;padding:12px 14px !important;margin:4px 0;border-bottom:none !important;
  border:1px solid rgba(239,91,35,.3);
}

/* --- campanita de novedades --- */
.bell-wrap{position:relative;}
.bell-btn{background:transparent;border:none;font-size:18px;cursor:pointer;position:relative;padding:4px;line-height:1;}
.bell-badge{
  position:absolute;top:-4px;right:-4px;background:var(--red);color:#fff;
  font-size:10px;font-weight:800;border-radius:999px;min-width:16px;height:16px;
  display:flex;align-items:center;justify-content:center;padding:0 3px;
}
.bell-dropdown{
  position:absolute;top:calc(100% + 8px);right:0;width:280px;max-height:320px;overflow-y:auto;
  background:var(--panel);border:1px solid var(--panel-border);border-radius:10px;
  padding:12px;box-shadow:0 8px 24px rgba(0,0,0,.4);z-index:30;text-align:left;
}
.bell-list{list-style:none;padding:0;margin:0 0 10px;font-size:12.5px;}
.bell-list li{padding:7px 0;border-bottom:1px dashed var(--panel-border);line-height:1.5;}
.bell-list li:last-child{border-bottom:none;}
.login-form{gap:8px;}
.login-form select, .login-form input{
  background:var(--panel);border:1px solid var(--panel-border);color:var(--text);
  border-radius:8px;padding:7px 10px;font-size:13px;
}
.login-error{width:100%;text-align:right;color:var(--red);font-size:12px;margin-top:-6px;margin-bottom:10px;}
.admin-tag{background:var(--gold);color:#2a1c00;border-radius:999px;padding:2px 8px;font-size:10.5px;font-weight:800;letter-spacing:.03em;}
.member-actions{font-size:11px;margin-left:8px;}

/* --- cancha táctica --- */
.pitch-wrap{display:flex;justify-content:center;margin-top:12px;}
.pitch{
  position:relative;width:100%;max-width:320px;aspect-ratio:100/150;
  background:linear-gradient(180deg,#2d7a3a,#245f2f);
  border-radius:8px;overflow:hidden;box-shadow:0 4px 16px rgba(0,0,0,.4);
}
.pitch-lines{position:absolute;top:0;left:0;width:100%;height:100%;}
.pitch-slot{
  position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:2px;
  width:44px;
}
.pitch-slot-clickable{cursor:pointer;}
.pitch-jersey{
  width:30px;height:30px;border-radius:50%;background:rgba(0,0,0,.55);
  display:flex;align-items:center;justify-content:center;font-size:15px;
  border:2px solid rgba(255,255,255,.7);
}
.pitch-jersey-empty{background:rgba(0,0,0,.25);border-style:dashed;color:rgba(255,255,255,.6);font-weight:800;}
.pitch-slot-active .pitch-jersey{border-color:var(--accent);box-shadow:0 0 0 3px rgba(239,91,35,.4);}
.pitch-slot-label{font-size:9.5px;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.8);text-align:center;line-height:1.1;max-width:50px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

.assign-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px;margin-top:8px;}
.btn-opt-active{border-color:var(--accent) !important;background:var(--accent-soft) !important;}
.banner-warn{background:rgba(194,57,79,.12);border:1px solid var(--red);color:#f2b3bf;padding:10px 14px;border-radius:10px;font-size:13px;margin-bottom:14px;}

.tabs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:20px;}
.tab{
  background:var(--panel);border:1px solid var(--panel-border);color:var(--text-dim);
  padding:9px 15px;border-radius:999px;font-weight:700;font-size:12.5px;letter-spacing:.03em;
  text-transform:uppercase;cursor:pointer;transition:.15s;
}
.tab:hover{border-color:var(--accent);color:var(--text);}
.tab.active{background:var(--accent);border-color:var(--accent);color:#fff;}

.card{
  background:var(--panel);border:1px solid var(--panel-border);border-radius:var(--radius);
  padding:18px 20px;margin-bottom:14px;
}
.card h3{margin:0 0 10px;font-size:15px;letter-spacing:.02em;text-transform:uppercase;font-weight:800;}
.record-card{font-size:14px;}
.blacklist-card{background:rgba(194,57,79,.08);border-color:rgba(194,57,79,.4);}
.container-card{}
.names-line{font-size:14px;margin:6px 0;}
.hint{color:var(--text-dim);font-size:12.5px;margin:4px 0 0;line-height:1.5;}
.hint.italic{font-style:italic;}
.dim{color:var(--text-dim);}
.accent{color:var(--accent);font-weight:700;}
.blue{color:var(--blue);}
.green{color:var(--green);font-weight:700;}
.red{color:var(--red);font-weight:700;}
.link{color:var(--blue);cursor:pointer;text-decoration:underline;font-size:12.5px;}
.del-link{text-decoration:none;font-size:15px;}

.table-wrap{overflow-x:auto;}
table{border-collapse:collapse;width:100%;font-size:13px;}
table.board th, table.board td{padding:9px 10px;text-align:left;border-bottom:1px solid var(--panel-border);white-space:nowrap;}
table.board thead th{color:var(--text-dim);font-weight:700;font-size:11px;text-transform:uppercase;letter-spacing:.04em;}
td.name{font-weight:700;}

table.planilla{border-collapse:collapse;}
table.planilla th, table.planilla td{padding:8px 6px;text-align:center;border-bottom:1px solid var(--panel-border);font-size:12px;}
table.planilla thead th{color:var(--text-dim);font-weight:700;text-transform:uppercase;font-size:10.5px;letter-spacing:.03em;white-space:nowrap;}
.sticky-col{position:sticky;left:0;background:var(--panel);text-align:left !important;white-space:nowrap;padding-right:14px !important;font-weight:600;}

.badge{
  display:inline-flex;align-items:center;justify-content:center;
  width:26px;height:26px;border-radius:50%;font-size:13px;color:#fff;
}
.st-presente{background:var(--accent);}
.st-anfitrion{background:var(--gold);color:#2a1c00;}
.st-avisado{background:var(--blue);}
.st-sinavisar{background:var(--red);}
.cell-td{position:relative;}
.cell-td.clickable{cursor:pointer;}
.cell-td.clickable:hover .badge{outline:2px solid var(--text);}
.motivo-dot{position:absolute;top:6px;right:14px;width:6px;height:6px;border-radius:50%;background:#fff;}

.edit-td{background:var(--accent-soft);}
.edit-cell{display:flex;flex-direction:column;gap:6px;min-width:170px;padding:4px;}
.edit-cell select, .edit-cell input{
  background:var(--bg);border:1px solid var(--panel-border);color:var(--text);
  border-radius:6px;padding:6px 8px;font-size:12px;width:100%;
}
.edit-actions{display:flex;gap:6px;}

.legend{display:flex;flex-wrap:wrap;gap:14px;margin-top:14px;font-size:11.5px;color:var(--text-dim);}
.legend-item{display:flex;align-items:center;gap:6px;}
.legend .badge{width:20px;height:20px;font-size:10px;}
.legend .motivo-dot{position:static;}

.form-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;}
.form-row input, .form-row select{
  background:var(--bg);border:1px solid var(--panel-border);color:var(--text);
  border-radius:8px;padding:8px 10px;font-size:13px;flex:1;min-width:120px;
}
.btn{
  background:var(--accent);color:#fff;border:none;border-radius:8px;
  padding:9px 16px;font-weight:700;font-size:13px;cursor:pointer;letter-spacing:.02em;
}
.btn:hover{filter:brightness(1.1);}
.btn-sm{padding:7px 12px;font-size:12.5px;}
.btn-xs{padding:5px 10px;font-size:11.5px;}
.btn-ghost{background:transparent;border:1px solid var(--panel-border);color:var(--text-dim);}
.btn-opt{background:var(--panel);border:1px solid var(--panel-border);color:var(--text);}
.btn-opt:hover{border-color:var(--accent);}

.ext-log{list-style:none;padding:0;margin:10px 0 0;font-size:12.5px;}
.ext-log li{padding:3px 0;border-bottom:1px dashed var(--panel-border);}

.container-list{list-style:none;padding:0;margin:0;}
.container-list li{padding:8px 0;border-bottom:1px dashed var(--panel-border);font-size:13.5px;}
.container-list li:last-child{border-bottom:none;}

.topics-list{list-style:none;padding:0;margin:0;}
.topics-list li{padding:7px 0;border-bottom:1px dashed var(--panel-border);font-size:13.5px;}
.topics-list li:last-child{border-bottom:none;}

.settlements{list-style:none;padding:0;margin:0;}
.settlements li{padding:7px 0;border-bottom:1px dashed var(--panel-border);font-size:13.5px;}
.settlements li:last-child{border-bottom:none;}

.foro-head{display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:6px;margin-bottom:10px;font-size:14px;}
.comments{list-style:none;padding:0;margin:0 0 10px;font-size:13px;}
.comments li{padding:6px 0;border-bottom:1px dashed var(--panel-border);}

.trivia-q{font-size:15px;font-weight:600;display:flex;justify-content:space-between;align-items:center;gap:10px;}
.trivia-timer{background:var(--accent);color:#fff;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:800;}
.trivia-opts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px;}
@media(max-width:520px){.trivia-opts{grid-template-columns:1fr;}}

.participants-actions{display:flex;gap:14px;margin-top:8px;}
.participants-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px;margin-top:10px;}
.participant-chip{
  display:flex;align-items:center;gap:6px;background:var(--bg);border:1px solid var(--panel-border);
  border-radius:8px;padding:7px 10px;font-size:12.5px;cursor:pointer;user-select:none;
}
.participant-chip input{accent-color:var(--accent);width:14px;height:14px;}

.person-debts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px;}
@media(max-width:560px){.person-debts{grid-template-columns:1fr;}}
.person-debt-block{background:var(--bg);border:1px solid var(--panel-border);border-radius:10px;padding:12px 14px;}
.person-debt-name{font-weight:800;font-size:13.5px;text-transform:uppercase;letter-spacing:.02em;margin-bottom:6px;}
.debt-line{font-size:12.5px;padding:2px 0;color:var(--text-dim);}
.debt-line.red{color:var(--red);}
.debt-line.green{color:var(--green);}
.debt-line b{color:var(--text);}

.reset-card{text-align:center;}

.rsvp-vote-row{display:flex;gap:8px;margin:10px 0;flex-wrap:wrap;}
.rsvp-active-si{background:var(--green);color:#fff;border:none;}
.rsvp-active-tal{background:var(--gold);color:#2a1c00;border:none;}
.rsvp-active-no{background:var(--red);color:#fff;border:none;}
.rsvp-lists{display:flex;flex-direction:column;gap:4px;margin:10px 0;font-size:12.5px;}
.rsvp-group{color:var(--text-dim);}
.rsvp-admin-box{margin-top:12px;padding-top:12px;border-top:1px dashed var(--panel-border);}

@media(max-width:600px){
  .app-header{flex-direction:column;align-items:flex-start;}
  .logo{font-size:18px;}
}

/* --- fin de semana --- */
.notas-box{width:100%;background:var(--bg);border:1px solid var(--panel-border);color:var(--text);border-radius:8px;padding:8px;font-size:12.5px;min-height:56px;margin-bottom:6px;font-family:inherit;}
.finde-notas{font-size:12.5px;color:var(--text-dim);font-style:italic;margin:6px 0;line-height:1.5;}
.finde-chips{margin-top:10px;font-size:12.5px;}
.chip{display:inline-block;padding:3px 9px;border-radius:999px;margin:2px 3px 2px 0;font-size:11.5px;}
.chip-green{background:rgba(63,166,106,.15);color:var(--green);}
.chip-red{background:rgba(194,57,79,.15);color:var(--red);}
.chip-clickable{cursor:pointer;}
.chip-clickable:hover{outline:1px solid currentColor;}

/* --- container: etiquetas de origen --- */
.tag-auto{background:var(--red);color:#fff;font-size:10px;border-radius:999px;padding:2px 7px;margin-left:8px;}
.tag-voted{background:var(--gold);color:#2a1c00;font-size:10px;border-radius:999px;padding:2px 7px;margin-left:8px;}

/* --- estadísticas: gráfico --- */
.evo-chart{width:100%;height:200px;display:block;}

/* --- container: debates --- */
.debate-block{background:var(--bg);border:1px solid var(--panel-border);border-radius:10px;padding:12px 14px;margin-bottom:10px;}
.debate-block:last-child{margin-bottom:0;}
.debate-head{font-size:13px;margin-bottom:4px;}
.debate-reason{font-size:12.5px;font-style:italic;color:var(--text-dim);margin:4px 0 8px;line-height:1.5;}
.btn-debate-si{background:var(--red);color:#fff;border:none;}
.btn-debate-no{background:var(--green);color:#fff;border:none;}

/* --- estadísticas: podio --- */
.podium{display:flex;gap:12px;align-items:flex-end;justify-content:center;margin-top:16px;}
.podium-slot{flex:1;max-width:150px;text-align:center;}
.podium-medal{font-size:26px;margin-bottom:6px;filter:drop-shadow(0 2px 3px rgba(0,0,0,.4));}
.podium-names{font-size:12.5px;font-weight:800;margin-bottom:8px;min-height:34px;letter-spacing:.01em;}
.podium-bar{
  border-radius:12px 12px 5px 5px;
  display:flex;align-items:flex-end;justify-content:center;
  padding-bottom:12px;
  box-shadow:0 8px 18px rgba(0,0,0,.4), inset 0 1px 0 rgba(255,255,255,.25);
}
.podium-pct{font-size:18px;font-weight:900;letter-spacing:.01em;}
.podium-bar.tier-1{background:linear-gradient(180deg,#ffe38f 0%,#e0a930 55%,#b9821f 100%);color:#3a2400;}
.podium-bar.tier-2{background:linear-gradient(180deg,#eef2f6 0%,#b9c3cd 55%,#8b95a1 100%);color:#20242b;}
.podium-bar.tier-3{background:linear-gradient(180deg,#e8b083 0%,#c47c47 55%,#96562a 100%);color:#341c0b;}
</style>
</head>
<body>
<div id="root"></div>
<script>
/* ============================================================
   FÚTBOL SUB — app hermana de Juntadas Sub
   Mismo "ADN" técnico (Firebase, login por nombre+contraseña,
   admins = capitanes), datos completamente separados.
   ============================================================ */

/* ---------- catálogo de posiciones (se reutiliza en plantel Y en la táctica) ---------- */

const POSITION_LABELS = {
  GK: "Arquero",
  LB: "Lateral Izquierdo",
  CB: "Central",
  RB: "Lateral Derecho",
  LWB: "Carrilero Izquierdo",
  RWB: "Carrilero Derecho",
  CDM: "Volante Central (contención)",
  CM: "Volante Central",
  CAM: "Volante Ofensivo",
  LM: "Volante por Izquierda",
  RM: "Volante por Derecha",
  LW: "Extremo Izquierdo",
  RW: "Extremo Derecho",
  ST: "Delantero",
};
const POSITION_ORDER = ["GK","LB","CB","RB","LWB","RWB","CDM","CM","CAM","LM","RM","LW","RW","ST"];

/* ---------- estado en memoria ---------- */

let currentUser = null;
let currentTab = "plantel";
let loading = true;
let loadError = false;
let loginError = "";

let fbApp = null;
let fbAuth = null;
let fbRoot = null;

let FDB = null;   // datos del equipo (jugadores, partidos, etc.)
let FAUTH = {};   // { nombre: password }

/* ---------- modelo de datos ---------- */

function seedFDB() {
  return {
    jugadores: [],      // [{ nombre, posicion }]
    admins: [],         // capitanes
    formacionActual: null, // { esquema, asignaciones: { slotId: nombreJugador } }
    partidos: [],        // [{ id, fecha, rival, ... }] — se suma en la próxima etapa
    torneoTabla: null,    // { foto (dataURL), fecha, subidoPor } — se suma en la próxima etapa
  };
}

function normalizeFDB() {
  if (!FDB.jugadores) FDB.jugadores = [];
  if (!FDB.admins) FDB.admins = [];
  if (FDB.formacionActual === undefined) FDB.formacionActual = null;
  if (!FDB.partidos) FDB.partidos = [];
  if (FDB.torneoTabla === undefined) FDB.torneoTabla = null;
}

function isAdmin(name) {
  return !!(FDB && FDB.admins.includes(name));
}

function escapeHtml(str) {
  return String(str)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
}
function escapeAttr(s) { return String(s).replace(/'/g, "\\'"); }

/* ---------- persistencia (Firebase — mismo proyecto que Juntadas Sub, otra rama de datos) ---------- */

const FIREBASE_CONFIG = {
  apiKey: "AIzaSyByxgmGFtJJYzfOjqc_fZBqOkUY5AKSGAc",
  authDomain: "juntadas-sub.firebaseapp.com",
  databaseURL: "https://juntadas-sub-default-rtdb.firebaseio.com",
  projectId: "juntadas-sub",
  storageBucket: "juntadas-sub.firebasestorage.app",
  messagingSenderId: "556893326875",
  appId: "1:556893326875:web:4eefcdc7d5cf58f75fb2be",
};

function initFirebase() {
  if (typeof firebase === "undefined") return false;
  try {
    fbApp = firebase.initializeApp(FIREBASE_CONFIG);
    fbAuth = firebase.auth();
    fbRoot = firebase.database();
    return true;
  } catch (err) {
    console.error("Error inicializando Firebase:", err);
    return false;
  }
}

async function firebaseSignIn() {
  try {
    await fbAuth.signInAnonymously();
    return true;
  } catch (err) {
    console.error("Error de autenticación anónima:", err);
    return false;
  }
}

async function loadAll() {
  loading = true;
  loadError = false;
  render();

  if (!initFirebase()) { loadError = true; loading = false; render(); return; }
  const signedIn = await firebaseSignIn();
  if (!signedIn) { loadError = true; loading = false; render(); return; }

  try {
    const dbSnap = await fbRoot.ref("futbol/db").once("value");
    FDB = dbSnap.exists() ? dbSnap.val() : seedFDB();
    normalizeFDB();

    const authSnap = await fbRoot.ref("futbol/auth").once("value");
    FAUTH = authSnap.exists() ? authSnap.val() : {};

    fbRoot.ref("futbol/db").on("value", snap => {
      if (snap.exists()) { FDB = snap.val(); normalizeFDB(); render(); }
    });
  } catch (err) {
    console.error("Error cargando datos:", err);
    loadError = true;
  }
  loading = false;
  render();
}

async function saveFDB() {
  try {
    await fbRoot.ref("futbol/db").set(FDB);
  } catch (err) {
    console.error("Error guardando:", err);
    alert("No se pudo guardar el cambio. Revisá tu conexión e intentá de nuevo.");
  }
}

async function saveFAuth() {
  try {
    await fbRoot.ref("futbol/auth").set(FAUTH);
  } catch (err) {
    console.error("Error guardando auth:", err);
  }
}

/* ---------- login ---------- */

async function handleLogin(name, pass) {
  loginError = "";
  if (!name || !pass) { loginError = "Completá tu nombre y contraseña."; render(); return; }
  if (FAUTH[name] === undefined) {
    FAUTH[name] = pass;
    await saveFAuth();
    currentUser = name;
  } else if (FAUTH[name] === pass) {
    currentUser = name;
  } else {
    loginError = "Contraseña incorrecta.";
    render();
    return;
  }
  render();
}

function doLoginClick() {
  const name = document.getElementById("login-name").value;
  const pass = document.getElementById("login-pass").value;
  handleLogin(name, pass);
}

function handleLogout() {
  currentUser = null;
  render();
}

/* ---------- plantel (roster) ---------- */

async function addPlayer(nombre, posicion) {
  if (FDB.jugadores.length > 0 && !isAdmin(currentUser)) return;
  nombre = (nombre || "").trim();
  if (!nombre) { alert("Escribí el nombre del jugador."); return; }
  if (FDB.jugadores.some(j => j.nombre === nombre)) { alert("Ya hay un jugador con ese nombre."); return; }
  FDB.jugadores.push({ nombre, posicion: posicion || "CM" });
  // el primer jugador que se agrega, si todavía no hay ningún capitán, queda como capitán automáticamente
  if (!FDB.admins.length) FDB.admins.push(nombre);
  await saveFDB();
  render();
}

function submitAddPlayer() {
  const nameInput = document.getElementById("new-player-name");
  const posSelect = document.getElementById("new-player-pos");
  addPlayer(nameInput.value, posSelect.value);
  nameInput.value = "";
}

async function removePlayer(nombre) {
  if (!isAdmin(currentUser)) return;
  if (!confirm(`¿Sacar a ${nombre} del plantel? Esto no borra sus estadísticas de partidos ya jugados.`)) return;
  FDB.jugadores = FDB.jugadores.filter(j => j.nombre !== nombre);
  FDB.admins = FDB.admins.filter(a => a !== nombre);
  // si tenía una posición asignada en la formación actual, la liberamos
  if (FDB.formacionActual) {
    Object.keys(FDB.formacionActual.asignaciones).forEach(slotId => {
      if (FDB.formacionActual.asignaciones[slotId] === nombre) delete FDB.formacionActual.asignaciones[slotId];
    });
  }
  await saveFDB();
  render();
}

async function setPlayerPosition(nombre, posicion) {
  if (!isAdmin(currentUser) && currentUser !== nombre) return;
  const j = FDB.jugadores.find(x => x.nombre === nombre);
  if (!j) return;
  j.posicion = posicion;
  await saveFDB();
  render();
}

async function toggleCaptain(nombre) {
  if (!isAdmin(currentUser)) return;
  if (FDB.admins.includes(nombre)) {
    if (FDB.admins.length <= 1) { alert("Tiene que quedar al menos un capitán."); return; }
    FDB.admins = FDB.admins.filter(a => a !== nombre);
  } else {
    FDB.admins.push(nombre);
  }
  await saveFDB();
  render();
}

let selectedSlot = null; // slot que se está por asignar (UI, no persiste)

async function setFormationScheme(esquema) {
  if (!isAdmin(currentUser)) return;
  if (!FORMATIONS[esquema]) return;
  if (FDB.formacionActual && FDB.formacionActual.esquema !== esquema) {
    if (!confirm("Cambiar de esquema vacía las posiciones ya asignadas (las formas no coinciden entre sí). ¿Seguro?")) return;
  }
  FDB.formacionActual = { esquema, asignaciones: {} };
  selectedSlot = null;
  await saveFDB();
  render();
}

function pickSlot(slotId) {
  if (!isAdmin(currentUser)) return;
  selectedSlot = selectedSlot === slotId ? null : slotId;
  render();
}

async function assignSlot(slotId, nombre) {
  if (!isAdmin(currentUser) || !FDB.formacionActual) return;
  FDB.formacionActual.asignaciones[slotId] = nombre;
  selectedSlot = null;
  await saveFDB();
  render();
}

async function clearSlot(slotId) {
  if (!isAdmin(currentUser) || !FDB.formacionActual) return;
  delete FDB.formacionActual.asignaciones[slotId];
  selectedSlot = null;
  await saveFDB();
  render();
}

/* ============================================================
   RENDER — Fútbol Sub
   ============================================================ */

const TABS = [
  { id: "plantel", label: "Plantel", icon: "👕" },
  { id: "tactica", label: "Táctica", icon: "🧠" },
  { id: "partidos", label: "Partidos", icon: "📅" },
  { id: "estadisticas", label: "Estadísticas", icon: "📊" },
  { id: "torneo", label: "Torneo", icon: "🏆" },
];

function render() {
  const root = document.getElementById("root");
  if (loading) { root.innerHTML = renderLoading(); return; }
  if (loadError) { root.innerHTML = renderHeaderShell() + renderFatalError(); return; }
  root.innerHTML = renderHeader() + renderNav() + '<main id="content">' + renderTabContent() + "</main>";
}

function renderLoading() {
  return `<div class="loading-screen"><div class="flame">⚽</div><p>Cargando...</p></div>`;
}

function renderHeaderShell() {
  return `<header class="app-header"><div class="logo">⚽ <span>Fútbol Sub</span></div></header>`;
}

function renderFatalError() {
  return `<div class="banner-warn">No se pudo conectar al guardado compartido. Revisá tu conexión e intentá recargar la página.</div>`;
}

function renderHeader() {
  let authBox;
  if (currentUser) {
    const capTag = isAdmin(currentUser) ? ' <span class="admin-tag">🎖️ CAPITÁN</span>' : "";
    authBox = `<div class="auth-box">Sos <b>${escapeHtml(currentUser)}</b>${capTag} · <a class="link" onclick="handleLogout()">salir</a></div>`;
  } else {
    const options = FDB.jugadores.map(j => `<option value="${escapeHtml(j.nombre)}">${escapeHtml(j.nombre)}</option>`).join("");
    authBox = `
      <div class="auth-box login-form">
        ${FDB.jugadores.length ? `<select id="login-name">${options}</select>` : `<input id="login-name" placeholder="tu nombre" />`}
        <input id="login-pass" type="password" placeholder="contraseña" onkeydown="if(event.key==='Enter')doLoginClick()"/>
        <button class="btn btn-sm" onclick="doLoginClick()">Entrar</button>
      </div>
      ${loginError ? `<div class="login-error">${escapeHtml(loginError)}</div>` : ""}
    `;
  }
  return `
    <header class="app-header">
      <div class="logo">⚽ <span>Fútbol Sub</span></div>
      ${authBox}
    </header>
  `;
}

function renderNav() {
  return `<nav class="tabs">${TABS.map(t =>
    `<button class="tab ${currentTab === t.id ? "active" : ""}" onclick="switchTab('${t.id}')">${t.icon} ${t.label}</button>`
  ).join("")}</nav>`;
}

function switchTab(tab) {
  currentTab = tab;
  render();
}

function renderTabContent() {
  switch (currentTab) {
    case "plantel": return renderPlantel();
    case "tactica": return renderTactica();
    case "partidos": return renderComingSoon("📅 Partidos", "Acá se van a cargar los resultados y estadísticas de cada partido nuestro (goles, asistencias, tarjetas).");
    case "estadisticas": return renderComingSoon("📊 Estadísticas", "Rankings del equipo calculados en base a los partidos cargados: goleadores, tarjetas, presencias.");
    case "torneo": return renderComingSoon("🏆 Torneo", "Acá el capitán va a poder subir la foto de la tabla de posiciones del torneo, fecha a fecha.");
    default: return "";
  }
}

function renderComingSoon(title, desc) {
  return `
    <div class="card">
      <h3>${title}</h3>
      <p class="hint">${desc}</p>
      <p class="hint italic">Todavía no está construido — es parte de las próximas etapas.</p>
    </div>
  `;
}

/* ---------------- PLANTEL ---------------- */

function renderPlantel() {
  const byPos = [...FDB.jugadores].sort((a, b) => POSITION_ORDER.indexOf(a.posicion) - POSITION_ORDER.indexOf(b.posicion));

  const list = FDB.jugadores.length ? `
    <div class="card">
      <h3>👕 Plantel (${FDB.jugadores.length})</h3>
      <ul class="topics-list">
        ${byPos.map(j => `
          <li>
            <b>${escapeHtml(j.nombre)}</b>
            ${isAdmin(j.nombre) ? '<span class="admin-tag">🎖️ CAPITÁN</span>' : ""}
            <span class="hint">— ${POSITION_LABELS[j.posicion] || j.posicion}</span>
            ${(isAdmin(currentUser) || currentUser === j.nombre) ? `
              <select onchange="setPlayerPosition('${escapeAttr(j.nombre)}', this.value)" style="margin-left:8px;width:auto;display:inline-block;">
                ${POSITION_ORDER.map(p => `<option value="${p}" ${j.posicion === p ? "selected" : ""}>${POSITION_LABELS[p]}</option>`).join("")}
              </select>
            ` : ""}
            ${isAdmin(currentUser) ? `
              <span class="member-actions">
                <a class="link" onclick="toggleCaptain('${escapeAttr(j.nombre)}')">${isAdmin(j.nombre) ? "sacar capitán" : "hacer capitán"}</a>
                · <a class="link" onclick="removePlayer('${escapeAttr(j.nombre)}')">quitar</a>
              </span>
            ` : ""}
          </li>
        `).join("")}
      </ul>
    </div>
  ` : `<div class="card"><h3>👕 Plantel</h3><p class="hint">Todavía no hay jugadores cargados.</p></div>`;

  const addForm = isAdmin(currentUser) || !FDB.jugadores.length ? `
    <div class="card">
      <h3>➕ Agregar jugador</h3>
      <div class="form-row">
        <input id="new-player-name" placeholder="Nombre" onkeydown="if(event.key==='Enter')submitAddPlayer()"/>
        <select id="new-player-pos">${POSITION_ORDER.map(p => `<option value="${p}">${POSITION_LABELS[p]}</option>`).join("")}</select>
        <button class="btn btn-sm" onclick="submitAddPlayer()">Agregar</button>
      </div>
      ${!FDB.jugadores.length ? `<p class="hint">El primer jugador que agregues queda como capitán automáticamente.</p>` : ""}
    </div>
  ` : "";

  return list + addForm;
}

/* ---------------- TÁCTICA ---------------- */

function renderTactica() {
  const schemeOptions = Object.keys(FORMATIONS).map(k =>
    `<option value="${k}" ${FDB.formacionActual && FDB.formacionActual.esquema === k ? "selected" : ""}>${k}</option>`
  ).join("");

  const schemePicker = isAdmin(currentUser) ? `
    <div class="form-row">
      <select id="scheme-select" onchange="setFormationScheme(this.value)">
        <option value="" ${!FDB.formacionActual ? "selected" : ""} disabled>Elegir esquema...</option>
        ${schemeOptions}
      </select>
    </div>
  ` : "";

  if (!FDB.formacionActual) {
    return `
      <div class="card">
        <h3>🧠 Táctica</h3>
        ${schemePicker}
        <p class="hint">${isAdmin(currentUser) ? "Elegí un esquema para armar la formación." : "Todavía no hay una formación armada."}</p>
      </div>
    `;
  }

  const slots = FORMATIONS[FDB.formacionActual.esquema];
  const asign = FDB.formacionActual.asignaciones;
  const usados = new Set(Object.values(asign));
  const banca = FDB.jugadores.filter(j => !usados.has(j.nombre));

  const pitchSlots = slots.map(s => {
    const jugador = asign[s.id];
    const clickable = isAdmin(currentUser) ? `onclick="pickSlot('${s.id}')"` : "";
    return `
      <div class="pitch-slot ${selectedSlot === s.id ? "pitch-slot-active" : ""} ${clickable ? "pitch-slot-clickable" : ""}" style="left:${s.x}%;top:${s.y}%;" ${clickable}>
        <div class="pitch-jersey ${jugador ? "" : "pitch-jersey-empty"}">${jugador ? "👕" : "+"}</div>
        <div class="pitch-slot-label">${jugador ? escapeHtml(jugador) : POSITION_LABELS[s.pos].split(" ")[0]}</div>
      </div>
    `;
  }).join("");

  const pitchMarkings = `
    <svg class="pitch-lines" viewBox="0 0 100 150" preserveAspectRatio="none">
      <rect x="2" y="2" width="96" height="146" fill="none" stroke="rgba(255,255,255,.55)" stroke-width="0.6"/>
      <line x1="2" y1="75" x2="98" y2="75" stroke="rgba(255,255,255,.55)" stroke-width="0.6"/>
      <circle cx="50" cy="75" r="12" fill="none" stroke="rgba(255,255,255,.55)" stroke-width="0.6"/>
      <rect x="20" y="2" width="60" height="24" fill="none" stroke="rgba(255,255,255,.55)" stroke-width="0.6"/>
      <rect x="20" y="124" width="60" height="24" fill="none" stroke="rgba(255,255,255,.55)" stroke-width="0.6"/>
    </svg>
  `;

  const assignPanel = (isAdmin(currentUser) && selectedSlot) ? `
    <div class="card">
      <h3>Asignar: ${POSITION_LABELS[slots.find(s => s.id === selectedSlot).pos]}</h3>
      <div class="assign-grid">
        ${FDB.jugadores.map(j => `
          <button class="btn-opt ${asign[selectedSlot] === j.nombre ? "btn-opt-active" : ""}" onclick="assignSlot('${selectedSlot}','${escapeAttr(j.nombre)}')">
            ${escapeHtml(j.nombre)} <span class="hint">(${j.posicion})</span>
          </button>
        `).join("")}
      </div>
      ${asign[selectedSlot] ? `<a class="link" style="display:inline-block;margin-top:8px;" onclick="clearSlot('${selectedSlot}')">Vaciar este puesto</a>` : ""}
    </div>
  ` : "";

  return `
    <div class="card">
      <h3>🧠 Táctica — ${FDB.formacionActual.esquema}</h3>
      ${schemePicker}
      <div class="pitch-wrap">
        <div class="pitch">
          ${pitchMarkings}
          ${pitchSlots}
        </div>
      </div>
      ${isAdmin(currentUser) ? `<p class="hint">Tocá un puesto en la cancha para asignarle un jugador.</p>` : ""}
    </div>
    ${assignPanel}
    <div class="card">
      <h3>🪑 Banca (sin ubicar en la cancha)</h3>
      ${banca.length ? `<p class="names-line">${banca.map(j => escapeHtml(j.nombre)).join(", ")}</p>` : `<p class="hint">Todos están ubicados en la cancha.</p>`}
    </div>
  `;
}
loadAll();
</script>
